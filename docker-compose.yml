version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: rx-prices-db
    environment:
      POSTGRES_DB: nadac
      POSTGRES_USER: nadac_user
      POSTGRES_PASSWORD: nadac_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nadac_user -d nadac"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rx-prices-api
    environment:
      DATABASE_URL: postgresql://nadac_user:nadac_pass@db:5432/nadac
      NADAC_API_BASE_URL: https://data.medicaid.gov/api/1/datastore/query
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Optional: Run data ingestion on a schedule
  ingestion:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rx-prices-ingestion
    environment:
      DATABASE_URL: postgresql://nadac_user:nadac_pass@db:5432/nadac
      NADAC_API_BASE_URL: https://data.medicaid.gov/api/1/datastore/query
    depends_on:
      db:
        condition: service_healthy
    command: python -m app.ingest
    profiles:
      - ingestion

volumes:
  postgres_data:
